        error_msg2: "Şifreyi unuttuysanız, ağ yöneticinize başvurun."
    }
};

function detectLanguage() {
    var lang = (navigator.language || navigator.userLanguage || "en").split("-")[0];
    var full = navigator.language || "en";
    if (I18N[full]) return full;
    if (I18N[lang]) return lang;
    if (lang === "zh") return "zh-CN";
    return "en";
}

(function() {
    var lang = detectLanguage();
    var dict = I18N[lang];
    document.documentElement.lang = lang;
    if (lang === "ar") document.body.style.direction = "rtl";
    document.querySelectorAll("[data-i18n]").forEach(function(el) {
        var key = el.getAttribute("data-i18n");
        if (dict[key]) el.textContent = dict[key];
    });
    if (dict.page_title) document.title = dict.page_title;
})();
</script>
</body>
